name: Java CI with Maven

on:
  push:
    branches: [main, master, develop, pipeline-*]
  pull_request:
    branches: [main, master, develop, pipeline-*]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # Checks out your repository under $GITHUB_WORKSPACE
      - name: Set up JDK 19
        uses: actions/setup-java@v4 # Sets up a Java Development Kit (JDK)
        with:
          java-version: "19"
          distribution: "temurin"
          cache: "maven" # Caches Maven dependencies to speed up subsequent builds
      - name: Build, test and coverage check
        run: mvn -B clean verify
      - name: publish  JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/jacoco-report/
          retention-days: 1
      - name: publish  JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 1
      - name: Build with Maven
        run: mvn install # Executes the Maven build command
      - name: Run tests
        run: mvn test # Executes Maven tests
      - name: SonarQube Analysis with Maven
        run: mvn sonar:sonar -Dsonar.projectKey=Rincon10_CAIS-TALLER03 -Dsonar.organization=rincon10 -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONNAR_TOKEN }} -Dsonar.qualitygate.wait=true -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONNAR_TOKEN }}
