name: Java CI with Maven

on:
  push:
    branches: [main, develop, pipeline-*]
  pull_request:
    branches: [main, develop, pipeline-*]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 # Checks out your repository under $GITHUB_WORKSPACE
      - name: Set up JDK 19
        uses: actions/setup-java@v4 # Sets up a Java Development Kit (JDK)
        with:
          java-version: "19"
          distribution: "temurin"
          cache: "maven" # Caches Maven dependencies to speed up subsequent builds
      - name: Build with Maven
        run: mvn install # Executes the Maven build command
      - name: Run tests
        run: mvn test # Executes Maven tests
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONNAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=my-java-project
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.junit.reportsPath=target/surefire-reports
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true # Wait for quality gate status
